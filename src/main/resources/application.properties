spring.application.name=VeterinariaHuellitas

# Conexion a MySQL
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/veterinaria_huellitas_avance2_entrega_final?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true