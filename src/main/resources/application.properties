spring.application.name=VeterinariaHuellitas

# Conexion a MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/veterinaria_huellitas_avance2_entrega_final?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
# Zona de la clínica para validar horarios; independiente de la zona del servidor.
app.time-zone=${APP_TIME_ZONE:America/Costa_Rica}
